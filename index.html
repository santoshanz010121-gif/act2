```html
<!DOCTYPE html>
<html>
<head>
    <title>Student CRUD</title>
</head>
<body>

    <h2>Student Management System</h2>

    <input type="text" id="studentId" placeholder="Student ID">
    <input type="text" id="studentName" placeholder="Student Name">
    <input type="text" id="studentCourse" placeholder="Course">

    <input type="hidden" id="editIndex" value="-1">

    <button onclick="saveStudent()">Save</button>
    <button onclick="clearForm()">Clear</button>

    <br><br>

    <input type="text" id="searchInput" placeholder="Search student">
    <button onclick="searchStudent()">Search</button>
    <button onclick="displayStudents()">Show All</button>
    <button onclick="sortStudents()">Sort by Name</button>

    <br><br>

    <table border="1">
        <tr>
            <th>Student ID</th>
            <th>Name</th>
            <th>Course</th>
            <th>Action</th>
        </tr>

        <tbody id="studentTable"></tbody>
    </table>

    <p id="studentTotal">Total Students: 0</p>

    <script>

        let students = [];

        function saveStudent() {

            let id = document.getElementById("studentId").value;
            let name = document.getElementById("studentName").value;
            let course = document.getElementById("studentCourse").value;
            let editIndex = parseInt(document.getElementById("editIndex").value);

            if (id == "" || name == "" || course == "") {
                alert("Please complete all fields.");
                return;
            }

            let numbersOnly = true;

            for (let i = 0; i < id.length; i++) {

                if (id[i] < "0" || id[i] > "9") {
                    numbersOnly = false;
                    break;
                }
            }

            if (numbersOnly == false) {
                alert("Student ID must contain numbers only.");
                return;
            }

            for (let i = 0; i < students.length; i++) {

                if (i != editIndex) {

                    if (students[i].id == id) {
                        alert("Student ID already exists.");
                        return;
                    }

                    if (students[i].name.toLowerCase() == name.toLowerCase()) {
                        alert("Student name already exists.");
                        return;
                    }
                }
            }

            if (editIndex == -1) {

                let newStudent = {
                    id: id,
                    name: name,
                    course: course
                };

                students[students.length] = newStudent;

                alert("Student added successfully.");

            } else {

                students[editIndex].id = id;
                students[editIndex].name = name;
                students[editIndex].course = course;

                alert("Student updated successfully.");
            }

            clearForm();
            displayStudents();
        }


        function displayStudents() {

            let table = document.getElementById("studentTable");

            table.innerHTML = "";

            if (students.length == 0) {

                table.innerHTML =
                    "<tr>" +
                    "<td colspan='4'>No student records found.</td>" +
                    "</tr>";

            } else {

                for (let i = 0; i < students.length; i++) {

                    table.innerHTML +=
                        "<tr>" +
                        "<td>" + students[i].id + "</td>" +
                        "<td>" + students[i].name + "</td>" +
                        "<td>" + students[i].course + "</td>" +
                        "<td>" +
                        "<button onclick='editStudent(" + i + ")'>Edit</button> " +
                        "<button onclick='deleteStudent(" + i + ")'>Delete</button>" +
                        "</td>" +
                        "</tr>";
                }
            }

            document.getElementById("studentTotal").innerHTML =
                "Total Students: " + students.length;
        }


        function editStudent(index) {

            document.getElementById("studentId").value =
                students[index].id;

            document.getElementById("studentName").value =
                students[index].name;

            document.getElementById("studentCourse").value =
                students[index].course;

            document.getElementById("editIndex").value = index;
        }


        function deleteStudent(index) {

            let answer = confirm(
                "Are you sure you want to delete this student?"
            );

            if (answer == false) {
                return;
            }

            for (let i = index; i < students.length - 1; i++) {
                students[i] = students[i + 1];
            }

            students.length = students.length - 1;

            clearForm();
            displayStudents();

            alert("Student deleted successfully.");
        }


        function clearForm() {

            document.getElementById("studentId").value = "";
            document.getElementById("studentName").value = "";
            document.getElementById("studentCourse").value = "";
            document.getElementById("editIndex").value = -1;
        }


        function searchStudent() {

            let search = document.getElementById("searchInput").value;
            let table = document.getElementById("studentTable");

            search = search.toLowerCase();

            table.innerHTML = "";

            let found = false;

            for (let i = 0; i < students.length; i++) {

                let id = students[i].id.toLowerCase();
                let name = students[i].name.toLowerCase();

                if (id.indexOf(search) != -1 ||
                    name.indexOf(search) != -1) {

                    table.innerHTML +=
                        "<tr>" +
                        "<td>" + students[i].id + "</td>" +
                        "<td>" + students[i].name + "</td>" +
                        "<td>" + students[i].course + "</td>" +
                        "<td>" +
                        "<button onclick='editStudent(" + i + ")'>Edit</button> " +
                        "<button onclick='deleteStudent(" + i + ")'>Delete</button>" +
                        "</td>" +
                        "</tr>";

                    found = true;
                }
            }

            if (found == false) {

                table.innerHTML =
                    "<tr>" +
                    "<td colspan='4'>No student found.</td>" +
                    "</tr>";
            }
        }


        function sortStudents() {

            for (let i = 0; i < students.length - 1; i++) {

                for (let j = i + 1; j < students.length; j++) {

                    if (
                        students[i].name.toLowerCase() >
                        students[j].name.toLowerCase()
                    ) {

                        let temp = students[i];

                        students[i] = students[j];

                        students[j] = temp;
                    }
                }
            }

            displayStudents();
        }


        displayStudents();

    </script>

</body>
</html>
